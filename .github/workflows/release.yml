name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código da tag
        uses: actions/checkout@v4

      - name: Empacotar tudo em um único zip
        run: |
          set -e
          NAME="$(basename "$GITHUB_REPOSITORY")-${GITHUB_REF_NAME}.zip"
          # Exclusões: ajuste aqui conforme o projeto.
          # .git e .github não fazem parte do produto; *.zip evita incluir o próprio arquivo.
          zip -r "$NAME" . \
            -x '.git/*' '.github/*' '*.zip'
          echo "Arquivo gerado:"
          unzip -l "$NAME"
          echo "ZIP_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Publicar release com o zip
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
